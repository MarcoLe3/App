name: client workflow

on:
  push:
    branches: [main]
    paths:
      - 'client/tests/**'
  pull:
    branches: [main]
    paths:
      - 'client/tests/**'

jobs:
  test:
    build-and-test:
      runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm ci 
      
      - name: Run test
        run: npm test
