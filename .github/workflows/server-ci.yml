name: Server CI

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.14.4"
          enable-cache: true
          cache-dependency-glob: "server/requirements.txt"

      # Catch syntax errors and undefined names without enforcing formatting.
      - name: Check Python code
        run: uvx ruff check --select E9,F63,F7,F82 .

      - name: Check Python syntax
        run: uv run --no-project python -m compileall -q -x '(^|/)(\.venv|__pycache__)/' .

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip check --python .venv/bin/python

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      # Build only; this does not publish an image or start the database.
      - name: Build server image
        run: docker build -t server-ci ./server
